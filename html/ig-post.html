<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Drop Watcher — IG Post</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Crimson+Pro:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .card {
    width: 1080px;
    height: 1080px;
    background: #0a0a0a;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px;
  }

  /* Radial ember glow behind the title */
  .card::after {
    content: '';
    position: absolute;
    top: 35%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 800px;
    height: 800px;
    background: radial-gradient(ellipse at center, rgba(192,57,43,0.15) 0%, rgba(230,126,34,0.05) 40%, transparent 70%);
    pointer-events: none;
    animation: glowPulse 4s ease-in-out infinite;
  }

  /* Noise overlay */
  .noise {
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 10;
    opacity: 0.5;
  }

  /* Scan lines */
  .scanlines {
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 11;
  }

  /* Flame lines */
  .flame-top, .flame-bottom {
    position: absolute;
    left: 0;
    right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent 0%, #c0392b 20%, #e67e22 35%, #f39c12 50%, #e67e22 65%, #c0392b 80%, transparent 100%);
    animation: flamePulse 3s ease-in-out infinite;
    z-index: 5;
  }
  .flame-top { top: 0; }
  .flame-bottom { bottom: 0; }

  /* Vertical flame edges */
  .flame-left, .flame-right {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: linear-gradient(to bottom, transparent 0%, #c0392b 20%, #e67e22 35%, #f39c12 50%, #e67e22 65%, #c0392b 80%, transparent 100%);
    animation: flamePulse 3s ease-in-out infinite 0.5s;
    z-index: 5;
  }
  .flame-left { left: 0; }
  .flame-right { right: 0; }

  @keyframes flamePulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @keyframes glowPulse {
    0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
  }

  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.7; }
    94% { opacity: 1; }
    96% { opacity: 0.8; }
    97% { opacity: 1; }
  }

  .content {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .eyebrow {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.6em;
    color: #c0392b;
    text-transform: uppercase;
    margin-bottom: 20px;
    animation: flicker 8s ease-in-out infinite;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 200px;
    line-height: 0.82;
    color: #f0f0f0;
    letter-spacing: -0.02em;
    text-shadow: 0 0 80px rgba(192,57,43,0.3), 0 0 160px rgba(230,126,34,0.1);
  }

  .title span {
    display: block;
    -webkit-text-stroke: 2px #c0392b;
    color: transparent;
    filter: drop-shadow(0 0 30px rgba(192,57,43,0.4));
  }

  .divider {
    width: 200px;
    height: 1px;
    background: linear-gradient(90deg, transparent, #e67e22, transparent);
    margin: 40px 0;
  }

  .tagline {
    font-family: 'Crimson Pro', serif;
    font-style: italic;
    font-weight: 300;
    font-size: 32px;
    color: #ccc;
    max-width: 700px;
    line-height: 1.5;
  }

  .tagline strong {
    color: #e67e22;
    font-weight: 300;
  }

  .url {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    letter-spacing: 0.4em;
    color: #e67e22;
    text-transform: uppercase;
    margin-top: 50px;
    text-shadow: 0 0 20px rgba(230,126,34,0.4);
  }

  .pills {
    display: flex;
    gap: 16px;
    margin-top: 30px;
  }

  .pill {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: #888;
    text-transform: uppercase;
    border: 1px solid #333;
    padding: 6px 16px;
  }

  .bottom-bar {
    position: absolute;
    bottom: 30px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 40px;
    z-index: 5;
  }

  .bottom-item {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.35em;
    color: #444;
    text-transform: uppercase;
  }

  .status-dot {
    display: inline-block;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #2ecc71;
    margin-right: 6px;
    box-shadow: 0 0 8px #2ecc71;
    animation: dotPulse 2s ease-in-out infinite;
  }

  @keyframes dotPulse {
    0%, 100% { box-shadow: 0 0 4px #2ecc71; }
    50% { box-shadow: 0 0 12px #2ecc71, 0 0 20px rgba(46,204,113,0.3); }
  }
</style>
</head>
<body>
<div class="card">
  <div class="noise"></div>
  <div class="scanlines"></div>
  <div class="flame-top"></div>
  <div class="flame-bottom"></div>
  <div class="flame-left"></div>
  <div class="flame-right"></div>

  <div class="content">
    <div class="eyebrow">You sleep. We watch. You score.</div>

    <div class="title">
      DROP
      <span>WATCHER</span>
    </div>

    <div class="divider"></div>

    <div class="tagline">
      Give it a URL. Tell it what to watch for.<br>
      Get a <strong>text</strong> and an <strong>email</strong> when it hits.
    </div>

    <div class="url">instockornot.club</div>

    <div class="pills">
      <div class="pill">Free</div>
      <div class="pill">AI Powered</div>
      <div class="pill">No Account</div>
    </div>
  </div>

  <div class="bottom-bar">
    <span class="bottom-item"><span class="status-dot"></span>Watching</span>
    <span class="bottom-item">Knives</span>
    <span class="bottom-item">Sneakers</span>
    <span class="bottom-item">GPUs</span>
    <span class="bottom-item">Limited Drops</span>
    <span class="bottom-item">Anything</span>
  </div>
</div>
</body>
</html>
